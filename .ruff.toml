target-version = "py312"
line-length = 100
extend-exclude = [
  "backend/alembic/versions",
  "backend/app/scheduler.py",
  "sdk/python/src/cohortswitch/client.py",
]

[lint]
select = ["E", "F", "I", "UP", "B", "ASYNC", "S", "SIM", "RUF"]
