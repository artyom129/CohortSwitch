[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "cohortswitch-server"
version = "0.1.0"
description = "Self-hosted feature flags and progressive rollouts for backend applications."
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
authors = [{ name = "CohortSwitch contributors" }]
dependencies = [
  "alembic>=1.17,<2",
  "argon2-cffi>=25.1,<26",
  "asyncpg>=0.30,<1",
  "email-validator>=2.2,<3",
  "fastapi>=0.140,<0.141",
  "httpx>=0.28,<1",
  "packaging>=24.2,<27",
  "prometheus-client>=0.23,<1",
  "pydantic>=2.13,<3",
  "pydantic-settings>=2.11,<3",
  "PyJWT>=2.10,<3",
  "redis>=7.2,<8",
  "sqlalchemy[asyncio]>=2.0.52,<2.1",
  "structlog>=25.4,<26",
  "uvicorn[standard]>=0.35,<1",
]

[project.optional-dependencies]
dev = [
  "aiosqlite>=0.21,<1",
  "build>=1.3,<2",
  "pytest>=8.4,<9",
  "pytest-asyncio>=1.1,<2",
  "pytest-cov>=6.2,<7",
  "ruff>=0.12,<1",
]

[tool.hatch.build.targets.wheel]
packages = ["backend"]

[tool.pytest.ini_options]
addopts = "-ra --strict-markers --cov=backend.app --cov-report=term-missing"
asyncio_mode = "auto"
testpaths = ["backend/tests"]
markers = ["integration: requires PostgreSQL and Redis"]

[tool.coverage.run]
branch = true
source = ["backend/app"]

[tool.ruff]
target-version = "py312"
line-length = 100
extend-exclude = ["backend/alembic/versions"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "ASYNC", "S", "SIM", "RUF"]
ignore = ["S101"]

[tool.ruff.lint.per-file-ignores]
"backend/tests/**" = ["S105", "S106"]

