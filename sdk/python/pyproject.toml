[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "cohortswitch"
version = "0.1.0"
description = "Async Python SDK for CohortSwitch."
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
dependencies = ["httpx>=0.28,<1"]

[tool.hatch.build.targets.wheel]
packages = ["src/cohortswitch"]

